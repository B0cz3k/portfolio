name: Deploy to github.io

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Build static site artifact
        run: bash scripts/build-pages.sh

      - name: Validate deployment token
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Missing PAGES_DEPLOY_TOKEN. Add a repository secret in B0cz3k/portfolio with write access to B0cz3k/B0cz3k.github.io."
            exit 1
          fi

      - name: Checkout github.io repository
        uses: actions/checkout@v5
        with:
          repository: B0cz3k/B0cz3k.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          ref: gh-pages
          path: github-io

      - name: Publish static site
        run: |
          find github-io -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. github-io/
          cd github-io
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to publish"
            exit 0
          fi
          git commit -m "Deploy portfolio site from ${GITHUB_SHA}"
          git push origin gh-pages
